name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # index.html is committed, so a PR that edits src/ without rebuilding
      # would ship stale code to GitHub Pages. Catch that first.
      - name: index.html is up to date with src/
        run: npm run check

      - name: Codec and SEO tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Independent verification with Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          npm run test:verify

      - name: Browser tests (pixel engine and UI)
        env:
          SCRUB_REQUIRE_BROWSER: "1"
        run: npm run test:browser
